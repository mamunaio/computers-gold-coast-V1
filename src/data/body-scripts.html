<script>document.querySelectorAll('.nav-toggle').forEach(function(b){b.addEventListener('click',function(){var h=b.closest('.site-header');var o=h.classList.toggle('nav-open');b.setAttribute('aria-expanded',o);});});</script>
<script>(function(){var el=document.querySelector('[data-open-status]');if(!el)return;var t=el.querySelector('.os-text'),c=el.querySelector('.os-clock');function tick(){var now=new Date();var time=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Brisbane',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(now).toUpperCase();var h=parseInt(new Intl.DateTimeFormat('en-GB',{timeZone:'Australia/Brisbane',hour:'2-digit',hour12:false}).format(now),10);if(h>=7&&h<22){el.classList.add('is-open');el.classList.remove('is-closed');t.textContent='Open Now';c.textContent=time;}else{el.classList.add('is-closed');el.classList.remove('is-open');t.textContent='Closed';c.textContent='Opens 7 AM';}}tick();setInterval(tick,1000);})();</script>
